name: 编译tvbox

on:
  schedule:
    - cron: 0 20 * * *
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean
      fongmi_app_name:
        description: '指定要构建的 FongMi 应用名称（如：蜂蜜影视, 影视TV）'
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: FongMi
            repoName: TV
            branchName: fongmi
            jdkVersion: 17
          - userName: q215613905
            repoName: TVBoxOS
            branchName: main
            jdkVersion: 17
          - userName: takagen99
            repoName: Box
            branchName: main
            jdkVersion: 17
          - userName: mlabalabala
            repoName: box
            branchName: main
            jdkVersion: 11

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Table Format
        if: ${{ env.commit }}
        run: |
          # 检查是否存在 Build Time 列，如果不存在则添加
          if ! grep -q "| Build Time |" README.md; then
            sed -i '/| Repository.*| Branch.*| Last Update/s/|$/| Build Time |/' README.md
            sed -i '/|--*|--*|--*/s/|$/|--*|/' README.md
            sed -i '/\[.*\].*|.*|.*[a-z0-9]\{40\}/s/|$/| - |/' README.md
          fi

      - name: Check New Commit
        run: |
          upStream=https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}
          echo "upStream=$upStream" >> $GITHUB_ENV
          commit=$(curl -sL $upStream/commits/${{ matrix.branchName }} |grep -o "/${{ matrix.userName }}/${{ matrix.repoName }}/commit/[a-z0-9]\+" |head -1 | cut -d\/ -f5)
          if [[ -z "${commit}" ]]; then
            commit=$(curl -s "https://api.github.com/repos/${{ matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}?per_page=1" | jq -r '.sha' )
          fi
          if ! grep -q "$commit" README.md || [ "${{ inputs.rebuild }}" == "true" ]; then
            echo "commit=$commit" >> $GITHUB_ENV
            echo "commitS=${commit:0:7}" >> $GITHUB_ENV
          fi
          echo "commit=$commit"

      # - name: 清理旧的构建目录
      #   run: rm -rf TVBoxOSC
        
      - name: Checkout Source Code
        if: ${{ env.commit }}
        run: |
          git clone ${{ env.upStream }} TVBoxOSC
          cd TVBoxOSC
          git checkout ${{ env.commit }}
          echo "tag=$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:%cd ${{ env.commitS }} -1)" >> $GITHUB_ENV
          
      - name: Setup Python 3.10
        if: ${{ env.commit }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          



      - name: Build FongMi media3 fork
        if: ${{ matrix.userName == 'FongMi' }}
        run: |
          echo "=== [1/6] Clone media3 fork ==="
          if [ -d /tmp/fongmi-media/.git ]; then
            cd /tmp/fongmi-media && git fetch --depth 1 origin release-1.10.1-fongmi && git checkout release-1.10.1-fongmi
          else
            git clone --depth 1 --branch release-1.10.1-fongmi --single-branch https://github.com/FongMi/media.git /tmp/fongmi-media 2>&1 | tail -5
          fi
          if [ ! -f /tmp/fongmi-media/gradlew ]; then
            echo "FATAL: clone failed!"
            ls -la /tmp/fongmi-media/ 2>&1 | head -20
            exit 1
          fi
          echo "[1/6] Clone OK"
          echo "=== [2/6] Install android-36 SDK ==="
          cd /tmp/fongmi-media
          if ! ls "$ANDROID_HOME/platforms/android-36" >/dev/null 2>&1; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" 2>&1 | tail -5 || echo "SDK already present"
          fi
          echo "=== [3/6] Setup repo directory ==="
          rm -rf /tmp/fongmi-media-repo/buildout
          mkdir -p /tmp/fongmi-media-repo/buildout
          echo "=== [4/6] Patch gradle files ==="
          if [ -f missing_aar_type_workaround.gradle ]; then
            sed -i '/throw new IllegalStateException(/d; /is not on the JAR or AAR list/d' missing_aar_type_workaround.gradle
            echo "Patched missing_aar workaround"
          fi
          echo "" | base64 -d > /tmp/patch_media3.py
          python3 /tmp/patch_media3.py
          echo "=== [5/6] Build & publish ==="
          set +e
          ./gradlew \
            :lib-common:publishReleasePublicationToMavenRepository \
            :lib-container:publishReleasePublicationToMavenRepository \
            :lib-database:publishReleasePublicationToMavenRepository \
            :lib-datasource:publishReleasePublicationToMavenRepository \
            :lib-datasource-okhttp:publishReleasePublicationToMavenRepository \
            :lib-decoder:publishReleasePublicationToMavenRepository \
            :lib-effect:publishReleasePublicationToMavenRepository \
            :lib-exoplayer:publishReleasePublicationToMavenRepository \
            :lib-exoplayer-dash:publishReleasePublicationToMavenRepository \
            :lib-exoplayer-hls:publishReleasePublicationToMavenRepository \
            :lib-exoplayer-rtsp:publishReleasePublicationToMavenRepository \
            :lib-exoplayer-smoothstreaming:publishReleasePublicationToMavenRepository \
            :lib-extractor:publishReleasePublicationToMavenRepository \
            :lib-session:publishReleasePublicationToMavenRepository \
            :lib-ui:publishReleasePublicationToMavenRepository \
            :lib-ui-danmaku:publishReleasePublicationToMavenRepository \
            --no-daemon --stacktrace > /tmp/gradle_build.log 2>&1
          GRADLE_EXIT=$?
          set -e
          echo "Gradle exit code: $GRADLE_EXIT"
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            echo "BUILD FAILED"
            tail -80 /tmp/gradle_build.log
            exit 1
          fi
          echo "=== [6/6] Verify AAR files ==="
          AAR_DIR=/tmp/fongmi-media-repo/buildout
          if [ ! -d "$AAR_DIR" ]; then
            echo "FAIL: $AAR_DIR not found"
            exit 1
          fi
          echo "All .aar files:"
          find "$AAR_DIR" -name '*.aar' -type f
          echo "=== DEBUG: AAR_DIR ==="
          ls -la "$AAR_DIR" 2>&1 || echo "AAR_DIR does not exist"
          echo "=== DEBUG: subdirs ==="
          find "$AAR_DIR" -type d 2>/dev/null | head -20
          echo "=== DEBUG: any aar in /tmp ==="
          find /tmp -name "*.aar" -type f 2>/dev/null | head -20
          TOTAL=$(find "$AAR_DIR" -name '*.aar' -type f | wc -l)
          echo "Total AAR count: $TOTAL"
          if [ "$TOTAL" -ge 15 ]; then
            echo "PASS: media3 AAR check ($TOTAL AARs)"
            exit 0
          else
            echo "FAIL: expected >=15 media3 AARs, found $TOTAL"
            tail -60 /tmp/gradle_build.log
            exit 1
          fi

      - name: Extra Modify
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          # 删除原有的 media3-ui-danmaku:1.8.0（Step 7 已构建 fork 版本 1.10.1-fongmi，Leanback variant 仍找 1.8.0 会导致 Could not find androidx.media3:media3-ui-danmaku:1.8.0）
          if [ -f "app/build.gradle" ]; then
            sed -i '/implementation.*androidx.media3:media3-ui-danmaku:/d' app/build.gradle
          fi
          
          # 统一处理 crosswalk 源
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/crosswalk/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          else
            sed -i "/jitpack.io/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi
          
          # 统一 minSdkVersion
          if [ -f "app/build.gradle" ]; then
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' app/build.gradle
          fi
          
      - name: Compress Source Code
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          tar -cJf source-${{ env.commitS }}.tar.xz --exclude=.git --exclude=.github *
          
      - name: Only for FongMi
        if: ${{ matrix.userName == 'FongMi' && env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo "开始 FongMi 定制..."
          echo "" | base64 -d > /tmp/fongmi_modify.py
          python3 /tmp/fongmi_modify.py

      - name: Setup JDK
        if: ${{ env.commit }}
        uses: actions/setup-java@main
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdkVersion }}

      - name: Setup Gradle
        if: ${{ env.commit }}
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=TVBoxOSC.jks" >> local.properties
          echo "keyAlias=TVBoxOSC" >> local.properties
          echo "storePassword=TVBoxOSC" >> local.properties
          echo "keyPassword=TVBoxOSC" >> local.properties
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          echo "=== local.properties ==="
          cat local.properties

      - name: Fix Chaquo buildPython
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          # 修复上游硬编码的 Windows Python 路径（chaquo buildPython），仅当存在 buildPython 配置时
          if grep -rq "buildPython" --include="*.gradle" .; then
            if ! command -v python3.11 >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq software-properties-common
              sudo add-apt-repository -y ppa:deadsnakes/ppa
              sudo apt-get update -qq
              sudo apt-get install -y -qq python3.11 python3.11-dev python3.11-distutils
            fi
            find . -name "build.gradle" -exec sed -i 's|buildPython("[^"]*")|buildPython("/usr/bin/python3.11")|' {} +
            echo "=== 修复后 buildPython 配置 ==="
            grep -r "buildPython" --include="*.gradle" .
          else
            echo "无 buildPython 配置（无需修复）"
          fi
          # 替换不稳定的阿里云 maven 镜像为官方仓库（takagen99 等上游配置了 aliyun，502 导致构建失败）
          if grep -rl "maven.aliyun.com" . >/dev/null 2>&1; then
            grep -rl "maven.aliyun.com" . | xargs sed -i 's|https://maven.aliyun.com/repository/public|https://repo1.maven.org/maven2|g; s|https://maven.aliyun.com/repository/google|https://maven.google.com|g; s|https://maven.aliyun.com/repository/central|https://repo1.maven.org/maven2|g; s|https://maven.aliyun.com/repository/gradle-plugin|https://plugins.gradle.org/m2|g; s|https://maven.aliyun.com/repository/releases|https://maven.aliyun.com/repository/public|g'
            echo "=== 已替换 aliyun 镜像 ==="
            grep -rn "aliyun" . || echo "无残留 aliyun 引用"
          fi
          # 降级 pyquery 到 1.4.3（chaquopy pip 索引快照里 cssselect 最高仅 1.2.0，pyquery 2.x 要求 cssselect>=1.5.0 无法满足；1.4.3 是可用的最新兼容版本）
          find . -path "*pyramid/build.gradle" -exec sed -i 's|install "pyquery"|install "pyquery==1.4.3"|g; s|pyquery==2.0.2|pyquery==1.4.3|g; s|pyquery==1.4.4|pyquery==1.4.3|g' {} +

      - name: Build With Gradle
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          chmod +x gradlew
          echo "org.gradle.daemon=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          # 执行构建，捕获错误日志
          set -o pipefail
          ./gradlew assemblerelease --build-cache --parallel --daemon --warning-mode all 2>&1 | tee build.log
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Build failed with exit code $BUILD_EXIT"
            tail -100 build.log
            exit $BUILD_EXIT
          fi

      - name: Prepare App
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          rm -rf apk/
          mkdir -p apk/
          find ~ -type d -iname "release" -print0 | while IFS= read -r -d '' dir; do
            find "$dir" -type f -name "*.apk" -exec sh -c 'cp "$1" "apk/${{ matrix.userName }}-${{ matrix.repoName }}-${{ matrix.branchName }}-${1##*/}"' sh {} \;
          done


      - name: Release Note
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          # 尝试获取上一次的 commit hash (只取第一个匹配结果)
          lastCommit=$(grep "\[${{ matrix.userName }}\/${{ matrix.repoName }}\]" ${{ github.workspace }}/README.md | grep "${{ matrix.branchName }}" | grep -o '[a-z0-9]\{40\}' | head -1)
          # 如果没有找到 commit hash，设置一个默认值以避免错误
          if [ -z "$lastCommit" ]; then
            echo "Warning: Could not find last commit hash for ${{ matrix.userName }}/${{ matrix.repoName }}/${{ matrix.branchName }}"
            lastCommit=${{ env.commit }}
          fi
          
          export LESSCHARSET=utf-8
          # 确保 apk 目录存在
          mkdir -p apk/
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:\n\`\`\`" > apk/${{ matrix.userName }}-Release.log
          if [ "${{ env.commit }}" == "${lastCommit}" ]; then
            git log --pretty=format:%B ${{ env.commitS }} -1 | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- >> apk/${{ matrix.userName }}-Release.log
          else
            git log --pretty=format:%B ${{ env.commitS }}...${lastCommit:0:7} | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- >> apk/${{ matrix.userName }}-Release.log
          fi
          echo -e '```' >> apk/${{ matrix.userName }}-Release.log
          # 确保日志文件存在并且有内容
          if [ ! -s "apk/${{ matrix.userName }}-Release.log" ]; then
            echo "No changes found" >> apk/${{ matrix.userName }}-Release.log
          fi


      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.userName }}-${{ matrix.repoName }}-${{ matrix.branchName }}
          path: |
            TVBoxOSC/apk/*

      - name: Whether Or Not to Publish
        if: ${{ inputs.donotpublish && env.commit }}
        run: |
          echo "commit=" >> $GITHUB_ENV

      - name: Release and Upload Assets
        uses: ncipollo/release-action@main
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}_${{ env.tag }}
          tag: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}_${{ env.tag }}
          bodyFile: TVBoxOSC/apk/${{ matrix.userName }}-Release.log
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            TVBoxOSC/apk/*.apk
            TVBoxOSC/source-${{ env.commitS }}.*

      - uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 5
          delete_tags: true
          delete_tag_pattern: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Push to master
        if: ${{ env.commit }}
        run: |
          rm -rf TVBoxOSC
          sed -i '/url =/d' ./.git/config
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url --add origin "https://${{ github.actor }}:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository }}"
          git pull --rebase
          
          # 获取当前时间，北京时间
          current_time=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 更新对应仓库的 commit hash 和构建时间
          sed -i "/\[${{ matrix.userName }}\/${{ matrix.repoName }}\].*${{ matrix.branchName }}/{
            s/[a-z0-9]\{40\}/${{ env.commit }}/
            s/| [^|]* |$/| $current_time |/
          }" README.md
          
          # 更新底部的更新时间
          sed -i "s/update at .*/update at ${current_time}/" README.md
          
          git add --all
          git commit -m "Update ${{ matrix.userName }}/${{ matrix.repoName }} to ${{ env.commit }} at ${current_time}"
          git push -u -f origin master


  clean:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3




