name: 缂栬瘧tvbox

on:
  schedule:
    - cron: 0 20 * * *
  workflow_dispatch:
    inputs:
      rebuild:
        description: '蹇界暐鏋勫缓璁板綍浠ラ噸鏂版瀯寤?
        required: false
        type: boolean
      donotpublish:
        description: '鏋勫缓鍚庝笉鎻愪氦鍙戝竷鏂扮増'
        required: false
        type: boolean
      fongmi_app_name:
        description: '鎸囧畾瑕佹瀯寤虹殑 FongMi 搴旂敤鍚嶇О锛堝锛氳渹铚滃奖瑙? 褰辫TV锛?
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: FongMi
            repoName: TV
            branchName: fongmi
            jdkVersion: 17
          - userName: q215613905
            repoName: TVBoxOS
            branchName: main
            jdkVersion: 17
          - userName: takagen99
            repoName: Box
            branchName: main
            jdkVersion: 17
          - userName: mlabalabala
            repoName: box
            branchName: main
            jdkVersion: 11

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Table Format
        if: ${{ env.commit }}
        run: |
          # 妫€鏌ユ槸鍚﹀瓨鍦?Build Time 鍒楋紝濡傛灉涓嶅瓨鍦ㄥ垯娣诲姞
          if ! grep -q "| Build Time |" README.md; then
            sed -i '/| Repository.*| Branch.*| Last Update/s/|$/| Build Time |/' README.md
            sed -i '/|--*|--*|--*/s/|$/|--*|/' README.md
            sed -i '/\[.*\].*|.*|.*[a-z0-9]\{40\}/s/|$/| - |/' README.md
          fi

      - name: Check New Commit
        run: |
          upStream=https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}
          echo "upStream=$upStream" >> $GITHUB_ENV
          commit=$(curl -sL $upStream/commits/${{ matrix.branchName }} |grep -o "/${{ matrix.userName }}/${{ matrix.repoName }}/commit/[a-z0-9]\+" |head -1 | cut -d\/ -f5)
          if [[ -z "${commit}" ]]; then
            commit=$(curl -s "https://api.github.com/repos/${{ matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}?per_page=1" | jq -r '.sha' )
          fi
          if ! grep -q "$commit" README.md || [ "${{ inputs.rebuild }}" == "true" ]; then
            echo "commit=$commit" >> $GITHUB_ENV
            echo "commitS=${commit:0:7}" >> $GITHUB_ENV
          fi
          echo "commit=$commit"

      # - name: 娓呯悊鏃х殑鏋勫缓鐩綍
      #   run: rm -rf TVBoxOSC
        
      - name: Checkout Source Code
        if: ${{ env.commit }}
        run: |
          git clone ${{ env.upStream }} TVBoxOSC
          cd TVBoxOSC
          git checkout ${{ env.commit }}
          echo "tag=$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:%cd ${{ env.commitS }} -1)" >> $GITHUB_ENV
          
      - name: Setup Python 3.10
        if: ${{ env.commit }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Extra Modify
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo 'crosswalk婧愶紝闃叉寕'
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/crosswalk/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          else
            sed -i "/jitpack.io/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi
          if [ -f "pyramid/build.gradle" ]; then
            sed -i 's/\(com.chaquo.python:gradle:\)12.0.1/\115.0.1/g' build.gradle
            python3 -m venv venv
            source venv/bin/activate
            sed -i 's|buildPython("D:/Programs/Python/Python38/python.exe")|buildPython("'"$(pwd)/venv/bin/python"'")|g' pyramid/build.gradle
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' pyramid/build.gradle
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' app/build.gradle
          fi

          # 澶勭悊 Chaquopy Python 閰嶇疆
          if [ -f "chaquo/build.gradle" ]; then
            echo "妫€娴嬪埌 chaquo 妯″潡,寮€濮嬮厤缃?Python 鐜"
          
            # 楠岃瘉 Python 3.10
            python3.10 --version
            PYTHON_PATH=$(which python3.10)
            echo "Python 璺緞: $PYTHON_PATH"
          
            # 鏇存柊 Chaquopy 鐗堟湰鍒?15.0.1
            sed -i 's/\(com.chaquo.python:gradle:\)[0-9.]\+/\115.0.1/g' build.gradle
          
            # 鍦?python 鍧椾腑娣诲姞 buildPython 閰嶇疆
            # 鍦?version "3.10" 杩欒鍚庨潰娣诲姞 buildPython
            sed -i "/version \"3.10\"/a\            buildPython \"$PYTHON_PATH\"" chaquo/build.gradle
          
            # 鏇存柊 minSdkVersion (濡傛灉闇€瑕?
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' chaquo/build.gradle 2>/dev/null || true
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' app/build.gradle 2>/dev/null || true
          
            echo "Python 鐜閰嶇疆瀹屾垚"
          
            # 鏄剧ず淇敼鍚庣殑閰嶇疆
            echo "=== chaquo/build.gradle python 閰嶇疆 ==="
            sed -n '/python {/,/^[[:space:]]*}/p' chaquo/build.gradle
          fi
          
          # 绉婚櫎 x86 鏋舵瀯
          if [ -f "app/build.gradle" ]; then
            sed -i '/x86 {/,/^[[:space:]]*}/d' app/build.gradle
            sed -i '/^[[:space:]]*$/N;/^\s*\n\s*$/d' app/build.gradle
          
            # 淇敼 applicationId 浠ュ厑璁镐笌鍘熺増鍏卞瓨
            sed -i 's/applicationId "com\.fongmi\.android\.tv"/applicationId "com.fongmi.tv"/' app/build.gradle
          fi
          
          # 淇敼 AndroidManifest.xml
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:authorities="com\.fongmi\.quickjs\.provider"/android:authorities="${applicationId}.quickjs.provider"/' app/src/main/AndroidManifest.xml
          fi

      - name: Compress Source Code
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          #zip -q -x ".git/*" -x  ".github/*" -r source-${{ env.commitS }}.zip .
          tar -cJf source-${{ env.commitS }}.tar.xz --exclude=.git --exclude=.github *

      - name: Release Apk Sign
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          #搴旂敤绛惧悕淇敼 
          signingConfigs=''
          signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyBzaWduaW5nQ29uZmlncy5teUNvbmZpZ1wKICAgICAgICAgICAgfVwK'
          signingConfigs="$(echo "$signingConfigs" |base64 -d )"
          signingConfig="$(echo "$signingConfig" |base64 -d )"
          sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle
                  
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     ./gradle.properties
          sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            ./gradle.properties
          sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       ./gradle.properties
          sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'         ./gradle.properties
          
      - name: Only for FongMi
        if: ${{ matrix.userName == 'FongMi' && env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo "杩欐槸 FongMi 鐨勪笓灞炲畾鍒?
          
          # 妫€鏌ュ叧閿枃浠舵槸鍚﹀瓨鍦?          if [ ! -f "app/build.gradle" ]; then
            echo "Error: app/build.gradle not found"
            exit 1
          fi
          
          # 鍖呭悕淇敼 - 浣跨敤鏇村鏉剧殑鍖归厤妯″紡
          if grep -q 'applicationId.*com\.fongmi\.android' app/build.gradle; then
            sed -i 's/applicationId "com\.fongmi\.android\.tv"/applicationId "com.fongmi.android.tv.yangxiaoge"/g' app/build.gradle
            sed -i "s/applicationId 'com\.fongmi\.android\.tv'/applicationId 'com.fongmi.android.tv.yangxiaoge'/g" app/build.gradle
          fi
          
          # apk鍛藉悕澧炲姞鐗堟湰鍙?          if grep -q 'outputFileName' app/build.gradle; then
            sed -i '/outputFileName.*\.apk"/s/\.apk"/-v${defaultConfig.versionName}.apk"/g' app/build.gradle
            sed -i "/outputFileName.*\.apk'/s/\.apk'/-v${defaultConfig.versionName}.apk'/g" app/build.gradle
          fi
          
          # 浠ｇ爜淇敼锛屽鍖?- 妫€鏌ユ枃浠跺瓨鍦ㄦ€?          if [ -f "app/src/main/java/com/fongmi/android/tv/App.java" ]; then
            sed -i '/public class App/i\
import java.util.LinkedHashMap;\
import java.util.Map;\
import com.fongmi.android.tv.bean.Config;\
' app/src/main/java/com/fongmi/android/tv/App.java
            
            # 搴旂敤鍚嶇О淇敼
            if [ -n "${{ github.event.inputs.fongmi_app_name }}" ]; then
              if [ -f "app/src/main/res/values-zh-rCN/strings.xml" ]; then
                sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.fongmi_app_name }}</string>|' app/src/main/res/values-zh-rCN/strings.xml
              fi
            else
              if [ -f "app/src/main/res/values-zh-rCN/strings.xml" ]; then
                sed -i 's|<string name="app_name">.*</string>|<string name="app_name">铚傝湝褰辫</string>|' app/src/main/res/values-zh-rCN/strings.xml
              fi
            fi
            
            # 浠ｇ爜淇敼锛屽唴缃簮
            sed -i '/public App()/i\
  private Map<String, String> sourceMap = new LinkedHashMap<>() {{\
      put("鑷敤(涓汉缁存姢)", "https://cdn.jsdelivr.net/gh/yangxiaoge/tvbox_cust@master/tvbox/self_use.txt");\
      put("楗お纭?, "http://www.楗お纭?com/tv");\
      put("ok澶栭儴", "http://ok321.top/ok");\
      put("鐜嬩簩灏?寮瑰箷)", "http://tvbox.鐜嬩簩灏忔斁鐗涘▋.top");\
      put("ok鍐呴儴(寮瑰箷)", "http://ok321.top/tv");\
  }};\
' app/src/main/java/com/fongmi/android/tv/App.java
            
            # 鍐呯疆婧愬啓鍏ユ暟鎹簱
            sed -i '/super\.onCreate();/a\
    // 娣诲姞榛樿鎺ュ彛\n\
    sourceMap.forEach((name, url) -> {\n\
        Config vodConfig = Config.find(url, 0); // 鐐规挱\n\
        if (vodConfig.getName() == null || vodConfig.getName().isEmpty()) {\n\
            vodConfig.setName(name);\n\
            vodConfig.update();\n\
        }\n\
        Config liveConfig = Config.find(url, 1); // 鐩存挱\n\
        if (liveConfig.getName() == null || liveConfig.getName().isEmpty()) {\n\
            liveConfig.setName(name);\n\
            liveConfig.update();\n\
        }\n\
    });' app/src/main/java/com/fongmi/android/tv/App.java
          fi
          
          # manifest淇敼锛岄伩鍏嶄笌鍘熺増褰辫provider鍐茬獊
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's|android:authorities="com\.fongmi\.quickjs\.provider"|android:authorities="com.fongmi.quickjs.provider.yangxiaoge"|' app/src/main/AndroidManifest.xml
          fi
          
          # 寮瑰箷寮€鍏抽粯璁ゅ紑鍚?- 妫€鏌ユ枃浠跺瓨鍦ㄦ€?          if [ -f "app/src/main/java/com/fongmi/android/tv/Setting.java" ]; then
            sed -i 's|getBoolean("danmaku_load")|getBoolean("danmaku_load", true)|' app/src/main/java/com/fongmi/android/tv/Setting.java
            sed -i 's|getBoolean("danmaku_show")|getBoolean("danmaku_show", true)|' app/src/main/java/com/fongmi/android/tv/Setting.java
          fi
          
          # 绉婚櫎fongmi鐗堢殑鏇存柊妫€娴嬩唬鐮佷互鍙妕oast鎻愮ず - 妫€鏌ユ枃浠跺瓨鍦ㄦ€?          if [ -f "app/src/leanback/java/com/fongmi/android/tv/Updater.java" ]; then
            sed -i 's/^\(.*App\.execute.*\)/\/\/ \1/' app/src/leanback/java/com/fongmi/android/tv/Updater.java
            sed -i 's/^\(.*Notify\.show.*\)/\/\/ \1/' app/src/leanback/java/com/fongmi/android/tv/Updater.java
          fi
          if [ -f "app/src/mobile/java/com/fongmi/android/tv/Updater.java" ]; then
            sed -i 's/^\(.*App\.execute.*\)/\/\/ \1/' app/src/mobile/java/com/fongmi/android/tv/Updater.java
            sed -i 's/^\(.*Notify\.show.*\)/\/\/ \1/' app/src/mobile/java/com/fongmi/android/tv/Updater.java
          fi

      - name: Setup JDK
        if: ${{ env.commit }}
        uses: actions/setup-java@main
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdkVersion }}

      - name: Setup Gradle
        if: ${{ env.commit }}
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build With Gradle
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          chmod +x gradlew
          echo "org.gradle.daemon=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          ./gradlew assemblerelease --build-cache --parallel --daemon --warning-mode all

      - name: Prepare App
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          rm -rf apk/
          mkdir -p apk/
          find ~ -type d -iname "release" -print0 | while IFS= read -r -d '' dir; do
            find "$dir" -type f -name "*.apk" -exec sh -c 'cp "$1" "apk/${{ matrix.userName }}-${{ matrix.repoName }}-${{ matrix.branchName }}-${1##*/}"' sh {} \;
          done

      - name: Release Note
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          # 灏濊瘯鑾峰彇涓婁竴娆＄殑 commit hash
          lastCommit=$(grep "\[${{ matrix.userName }}/${{ matrix.repoName }}\]" ${{ github.workspace }}/README.md | grep "${{ matrix.branchName }}" | grep -o '[a-z0-9]\{40\}' | head -1)
          
          # 濡傛灉娌℃湁鎵惧埌 commit hash锛屼娇鐢ㄥ綋鍓?commit 浣滀负榛樿鍊?          if [ -z "$lastCommit" ]; then
            echo "Warning: Could not find last commit hash for ${{ matrix.userName }}/${{ matrix.repoName }}/${{ matrix.branchName }}"
            lastCommit=${{ env.commit }}
          fi
          
          export LESSCHARSET=utf-8
          # 纭繚 apk 鐩綍瀛樺湪
          mkdir -p apk/
          
          # 鍒涘缓 Release log 鏂囦欢
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:\n\`\`\`" > apk/${{ matrix.userName }}-Release.log
          
          # 鐢熸垚 changelog
          if [ "${{ env.commit }}" == "$lastCommit" ]; then
            # 鍗曚釜 commit 鐨勬棩蹇?            git log --pretty=format:%B ${{ env.commitS }} -1 2>/dev/null | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- >> apk/${{ matrix.userName }}-Release.log || echo "No changelog available" >> apk/${{ matrix.userName }}-Release.log
          else
            # commit 鑼冨洿鐨勬棩蹇?            git log --pretty=format:%B ${{ env.commitS }}...${lastCommit:0:7} 2>/dev/null | sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' | cat -n | sort -k2,2 -k1,1n | uniq -f1 | sort -k1,1n | cut -f2- >> apk/${{ matrix.userName }}-Release.log || echo "No changelog available" >> apk/${{ matrix.userName }}-Release.log
          fi
          
          echo -e '\`\`\`' >> apk/${{ matrix.userName }}-Release.log
          
          # 纭繚鏃ュ織鏂囦欢鏈夊唴瀹?          if [ ! -s "apk/${{ matrix.userName }}-Release.log" ]; then
            echo "No changes found" >> apk/${{ matrix.userName }}-Release.log
          fi
          
          echo "Release log created successfully"
          cat apk/${{ matrix.userName }}-Release.log

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.userName }}-${{ matrix.repoName }}-${{ matrix.branchName }}
          path: |
            TVBoxOSC/apk/*

      - name: Whether Or Not to Publish
        if: ${{ inputs.donotpublish && env.commit }}
        run: |
          echo "commit=" >> $GITHUB_ENV

      - name: Release and Upload Assets
        uses: ncipollo/release-action@main
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}_${{ env.tag }}
          tag: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}_${{ env.tag }}
          bodyFile: TVBoxOSC/apk/${{ matrix.userName }}-Release.log
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            TVBoxOSC/apk/*.apk
            TVBoxOSC/source-${{ env.commitS }}.*

      - uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 5
          delete_tags: true
          delete_tag_pattern: ${{ matrix.userName }}_${{ matrix.repoName }}_${{ matrix.branchName }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN}}

      - name: Push to master
        if: ${{ env.commit }}
        run: |
          rm -rf TVBoxOSC
          sed -i '/url =/d' ./.git/config
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url --add origin "https://${{ github.actor }}:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository }}"
          git pull --rebase
          
          # 鑾峰彇褰撳墠鏃堕棿锛屽寳浜椂闂?          current_time=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 鏇存柊瀵瑰簲浠撳簱鐨?commit hash 鍜屾瀯寤烘椂闂?          sed -i "/\[${{ matrix.userName }}\/${{ matrix.repoName }}\].*${{ matrix.branchName }}/{
            s/[a-z0-9]\{40\}/${{ env.commit }}/
            s/| [^|]* |$/| $current_time |/
          }" README.md
          
          # 鏇存柊搴曢儴鐨勬洿鏂版椂闂?          sed -i "s/update at .*/update at ${current_time}/" README.md
          
          git add --all
          git commit -m "Update ${{ matrix.userName }}/${{ matrix.repoName }} to ${{ env.commit }} at ${current_time}"
          git push -u -f origin master


  clean:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3