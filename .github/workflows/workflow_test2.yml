name: Test Matrix Workflow

on:
  schedule:
    - cron: 0 20 * * *
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Rebuild'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: FongMi
            repoName: TV
            branchName: fongmi
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Echo
        run: |
          echo "Matrix job: ${{ matrix.userName }}/${{ matrix.repoName }}"