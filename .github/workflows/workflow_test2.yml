name: Test Matrix Workflow

on:
  schedule:
    - cron: 0 20 * * *
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Rebuild'
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: FongMi
            repoName: TV
            branchName: fongmi
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Echo
        run: |
          echo "Matrix job: ${{ matrix.userName }}/${{ matrix.repoName }}"
      - name: Keepalive commit
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > .github/last_run.txt
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/last_run.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore: keepalive auto commit"
            git push
          fi
